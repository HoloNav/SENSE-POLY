function drawScope(){const canv=$('#scope'),ctx=canv.getContext('2d');if(ctx){const {width:w,height:h}=canv;ctx.fillStyle='#081810';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#2e463a';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.strokeStyle='#9ef09a';ctx.lineWidth=1.8;ctx.beginPath();if(engine.analyser){const b=new Uint8Array(engine.analyser.fftSize);engine.analyser.getByteTimeDomainData(b);for(let x=0;x<w;x++){const i=Math.floor(x/w*b.length),y=b[i]/255*h;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}}else{for(let x=0;x<w;x++){const y=h/2+Math.sin(x*.08)*3;if(!x)ctx.moveTo(x,y);else ctx.lineTo(x,y);}}ctx.stroke();}requestAnimationFrame(drawScope);}
