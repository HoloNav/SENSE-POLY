name: V8 S.E.N.S.E. Signature Keybed Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'holonav.js'
      - 'holonav.css'
      - 'pattern-v5.js'
      - 'pattern-v5.css'
      - 'keyboard-v6.js'
      - 'keyboard-v6.css'
      - 'free-scroll-v7.js'
      - 'free-scroll-v7.css'
      - 'sense-keybed-v8.js'
      - 'sense-keybed-v8.css'
      - 'tests/v8-keybed.cjs'
      - 'tests/v5-smoke.cjs'
      - '.github/workflows/v5-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test harness
        run: npm install --no-save playwright-core@1.56.1
      - name: Check browser layout and pattern switching
        run: node tests/v5-smoke.cjs
      - name: Check V8 key dimensions, notes, octave shifts, and scrolling
        run: node tests/v8-keybed.cjs
      - name: Upload phone-sized screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENSE-POLY-V8-keybed
          path: screenshots/
          if-no-files-found: ignore
